name: CI Check

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
    paths-ignore:
      - 'PROGRESS.md'
      - '**.md'

jobs:
  go-bridge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Run Go bridge tests
        run: |
          cp version.json agy_ide_bridge/pkg/buildinfo/version.json
          cd agy_ide_bridge && go test ./...

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch termux-am
        run: |
          if git submodule status termux-am >/dev/null 2>&1; then
            git submodule update --init --depth 1 termux-am
          else
            git clone --depth 1 https://github.com/termux/TermuxAm.git termux-am
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Debug Kotlin & Build Debug APK
        run: ./gradlew :app:compileDebugKotlin :app:assembleDebug -Pabi=arm64
